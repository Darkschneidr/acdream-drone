; Fill these in, then double-click Start-Drone.bat.
; Any line left blank is asked for when you start.
server=127.0.0.1
port=9000
account=
; Character slot on the account, 0 is the first.
character=0
; Folder with your Asheron's Call dat files (client_portal.dat and so on).
datfolder=C:\Games\Asheron's Call
; Route: a town (holtburg), a move (orbit-sky), town:move, or list.
route=holtburg
; Time of day, 0.0 to 1.0. 0.5 is about noon.
worldtime=0.5
; 1 keeps the client open when the route ends. Blank or 0 closes it.
keepopen=0
